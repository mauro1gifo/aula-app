<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aula. cargando…</title></head><body style="background:#000;color:#fff;font-family:system-ui;padding:40px;text-align:center">
<p>Cargando Aula…</p>
<script>
const PARTS = 11;
async function go() {
  let s = "";
  for (let i = 0; i < PARTS; i++) {
    const r = await fetch("parts/p" + i + ".txt");
    s += await r.text();
  }
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const html = new TextDecoder().decode(bytes);
  document.open();
  document.write(html);
  document.close();
}
go().catch(e => { document.body.innerHTML = "<p>Error: "+e+"</p>"; });
</script>
</body></html>
